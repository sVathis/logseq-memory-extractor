name: tests

on:
  push:
  pull_request:

jobs:
  regression:
    name: regression (${{ matrix.os }}, ${{ matrix.python-version }}, ${{ matrix.deps }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
        deps: [full]
        include:
          # Without the optional packages the semantic paths must fail open;
          # this job keeps that behaviour (and the stdlib-only tests) covered.
          - os: ubuntu-latest
            python-version: "3.13"
            deps: stdlib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install numpy and mcp
        if: matrix.deps == 'full'
        run: python -m pip install numpy mcp
      - run: python -m unittest discover -s tests -v
